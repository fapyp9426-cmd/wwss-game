
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Little Stickmen</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: #ffffffed;
}

.panel {
  width: min(370px, 100%);
  padding: 30px 25px;
  border: 1px solid #eee;
  border-radius: 26px;
  background: white;
  text-align: center;
  box-shadow: 0 18px 60px #0000000c;
}

h1 {
  margin: 0 0 8px;
  color: #242936;
  font-size: 30px;
  letter-spacing: -1.2px;
}

.subtitle {
  margin-bottom: 24px;
  color: #999eaa;
  font-size: 14px;
}

.field-label {
  display: block;
  margin: 14px 0 7px;
  text-align: left;
  color: #656b76;
  font-size: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  outline: none;
  background: #fafafa;
  font-size: 16px;
  text-align: center;
}

input:focus {
  border-color: #9ba7f5;
}

.colors {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 14px 0 22px;
}

.color-choice {
  width: 31px;
  height: 31px;
  padding: 0;
  border: 3px solid white;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #e6e6e6;
  cursor: pointer;
}

.color-choice.selected {
  box-shadow: 0 0 0 3px #343b50;
}

#joinButton {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 14px;
  color: white;
  background: #5267e8;
  font-size: 16px;
  font-weight: bold;
}

#joinButton:active {
  transform: scale(.98);
}

#status {
  min-height: 18px;
  margin: 12px 0 0;
  color: #e05252;
  font-size: 13px;
}

#top {
  position: fixed;
  top: 15px;
  left: 50%;
  z-index: 3;
  transform: translateX(-50%);
  padding: 9px 16px;
  border: 1px solid #eee;
  border-radius: 30px;
  background: #ffffffdf;
  color: #656b76;
  font-size: 13px;
  white-space: nowrap;
  pointer-events: none;
}

#joystick {
  display: none;
  position: fixed;
  left: 24px;
  bottom: 25px;
  z-index: 4;
  width: 132px;
  height: 132px;
  border: 1px solid #e4e6ed;
  border-radius: 50%;
  background: #eef0f5aa;
  touch-action: none;
}

#stick {
  position: absolute;
  left: 38px;
  top: 38px;
  width: 54px;
  height: 54px;
  border: 1px solid #e1e3e9;
  border-radius: 50%;
  background: white;
  box-shadow: 0 4px 14px #00000015;
  pointer-events: none;
}

#punchButton {
  display: none;
  position: fixed;
  right: 25px;
  bottom: 38px;
  z-index: 5;
  width: 86px;
  height: 86px;
  border: 4px solid white;
  border-radius: 50%;
  background: #5267e8;
  color: white;
  font-size: 13px;
  font-weight: bold;
  box-shadow: 0 5px 20px #5267e855;
  touch-action: none;
}

#punchButton.cooldown {
  opacity: .5;
}

@media (pointer: coarse) {
  #joystick, #punchButton { display: block; }
}

@media (pointer: fine) {
  #punchButton {
    display: block;
    width: 66px;
    height: 66px;
    right: 22px;
    bottom: 22px;
    opacity: .75;
  }
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="top">Ожидание игроков...</div>

<div id="menu">
  <div class="panel">
    <h1>Little Stickmen</h1>
    <div class="subtitle">Маленький мир для двоих</div>

    <label class="field-label" for="nickname">ТВОЙ НИК</label>
    <input id="nickname" maxlength="16" placeholder="Например, Alex" value="Игрок">

    <label class="field-label" for="code">КОД КОМНАТЫ</label>
    <input id="code" maxlength="12" value="TEST123">

    <label class="field-label">ЦВЕТ ПЕРСОНАЖА</label>
    <div class="colors" id="colors"></div>

    <button id="joinButton">Играть</button>
    <p id="status"></p>
  </div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="punchButton">УДАР</button>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const statusText = document.getElementById("status");
const topText = document.getElementById("top");
const punchButton = document.getElementById("punchButton");

const COLORS = [
  "#5267e8", "#ef795f", "#29b58a", "#e0a33b",
  "#ad72dc", "#39a9c8", "#e56b9b", "#687586"
];

let selectedColor = COLORS[0];
let myId = null;
let joined = false;
let players = [];
let states = {};
let particles = [];
let effects = [];
let cameraX = 900;
let cameraY = 600;
let width = innerWidth;
let height = innerHeight;
let dpr = 1;
let lastFrame = performance.now();
let lastInputSend = 0;
let punchCooldown = 0;

const keys = {};
const movement = { x: 0, y: 0 };

function resize() {
  width = innerWidth;
  height = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

addEventListener("resize", resize);
resize();

// Выбор цвета
const colorContainer = document.getElementById("colors");

COLORS.forEach((color, index) => {
  const button = document.createElement("button");
  button.className = "color-choice" + (index === 0 ? " selected" : "");
  button.style.background = color;
  button.type = "button";
  button.setAttribute("aria-label", "Цвет " + (index + 1));

  button.addEventListener("click", () => {
    selectedColor = color;

    document.querySelectorAll(".color-choice").forEach(el => {
      el.classList.remove("selected");
    });

    button.classList.add("selected");
  });

  colorContainer.appendChild(button);
});

// Подключение
function join() {
  if (!socket.connected) {
    statusText.textContent = "Нет соединения. Подожди немного...";
    return;
  }

  statusText.textContent = "Подключаемся...";

  socket.emit("join", {
    code: document.getElementById("code").value,
    name: document.getElementById("nickname").value,
    color: selectedColor
  });
}

document.getElementById("joinButton").addEventListener("click", join);

document.getElementById("code").addEventListener("keydown", e => {
  if (e.key === "Enter") join();
});

document.getElementById("nickname").addEventListener("keydown", e => {
  if (e.key === "Enter") join();
});

socket.on("connect", () => {
  statusText.textContent = "";
});

socket.on("disconnect", () => {
  if (joined) topText.textContent = "Соединение потеряно...";
});

socket.on("joined", id => {
  myId = id;
  joined = true;
  menu.style.display = "none";
});

socket.on("errorMessage", message => {
  statusText.textContent = message;
});

socket.on("players", list => {
  players = list;

  const alive = new Set(list.map(p => p.id));

  for (const id of Object.keys(states)) {
    if (!alive.has(id)) delete states[id];
  }

  for (const p of list) {
    if (!states[p.id]) {
      states[p.id] = {
        ...p,
        tx: p.x,
        ty: p.y,
        serverVX: p.vx,
        serverVY: p.vy,
        downUntil: p.downUntil || 0,
        angle: 0,
        previousDown: false
      };
    }

    const s = states[p.id];

    s.name = p.name;
    s.color = p.color;
    s.tx = p.x;
    s.ty = p.y;
    s.serverVX = p.vx;
    s.serverVY = p.vy;
    s.faceX = p.faceX;
    s.faceY = p.faceY;

    const wasDown = s.downUntil > Date.now();
    s.downUntil = p.downUntil || 0;

    if (!wasDown && s.downUntil > Date.now()) {
      s.fallStarted = performance.now();
    }
  }

  topText.textContent = list.length === 2
    ? "Вы и " + (list.find(p => p.id !== myId)?.name || "друг")
    : "Ожидание второго игрока...";
});

// Управление с клавиатуры
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();

  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) {
    e.preventDefault();
  }

  keys[k] = true;

  if (e.code === "Space" && !e.repeat) punch();
});

addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

addEventListener("blur", () => {
  for (const key in keys) keys[key] = false;
  movement.x = 0;
  movement.y = 0;
});

function getMovement() {
  let x = movement.x;
  let y = movement.y;

  if (keys["a"] || keys["arrowleft"]) x -= 1;
  if (keys["d"] || keys["arrowright"]) x += 1;
  if (keys["w"] || keys["arrowup"]) y -= 1;
  if (keys["s"] || keys["arrowdown"]) y += 1;

  const length = Math.hypot(x, y);

  if (length > 1) {
    x /= length;
    y /= length;
  }

  return { x, y };
}

// Мобильный джойстик
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
let joyPointer = null;

function updateJoystick(e) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dx = e.clientX - cx;
  let dy = e.clientY - cy;

  const max = 39;
  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx = dx / length * max;
    dy = dy / length * max;
  }

  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  movement.x = dx / max;
  movement.y = dy / max;
}

joystick.addEventListener("pointerdown", e => {
  joyPointer = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystick.addEventListener("pointermove", e => {
  if (e.pointerId === joyPointer) updateJoystick(e);
});

function releaseJoystick(e) {
  if (e.pointerId !== joyPointer) return;

  joyPointer = null;
  movement.x = 0;
  movement.y = 0;
  stick.style.transform = "translate(0, 0)";
}

joystick.addEventListener("pointerup", releaseJoystick);
joystick.addEventListener("pointercancel", releaseJoystick);

// Удар
function punch() {
  if (!joined || punchCooldown > 0) return;

  const me = states[myId];
  if (!me || me.downUntil > Date.now()) return;

  punchCooldown = .7;
  me.punchAt = performance.now();

  socket.emit("punch");
}

punchButton.addEventListener("pointerdown", e => {
  e.preventDefault();
  punch();
});

socket.on("punchEffect", data => {
  const now = performance.now();
  effects.push({
    x: data.x,
    y: data.y,
    start: now,
    attacker: data.attacker,
    target: data.target
  });

  // Вспышка и частицы удара
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 65 + Math.random() * 210;

    particles.push({
      x: data.x,
      y: data.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: .35 + Math.random() * .3,
      maxLife: .65,
      size: 2 + Math.random() * 4,
      color: "#e9b64d"
    });
  }

  if (data.target && states[data.target]) {
    states[data.target].fallStarted = now;
  }
});

// Частицы бега
function addDust(x, y, color) {
  if (Math.random() > .17) return;

  particles.push({
    x: x + (Math.random() - .5) * 18,
    y: y + 23,
    vx: (Math.random() - .5) * 28,
    vy: -10 - Math.random() * 20,
    life: .4,
    maxLife: .4,
    size: 2 + Math.random() * 2,
    color: "#cbd0d9"
  });
}

// Обновление движения
function update(dt, now) {
  punchCooldown = Math.max(0, punchCooldown - dt);
  punchButton.classList.toggle("cooldown", punchCooldown > 0);

  if (!joined) return;

  const move = getMovement();

  if (now - lastInputSend > 35) {
    socket.emit("input", move);
    lastInputSend = now;
  }

  const me = states[myId];

  if (me) {
    const down = me.downUntil > Date.now();

    if (!down) {
      const targetVX = move.x * 270;
      const targetVY = move.y * 270;

      me.vx += (targetVX - me.vx) * Math.min(1, dt * 12);
      me.vy += (targetVY - me.vy) * Math.min(1, dt * 12);

      if (Math.hypot(move.x, move.y) > .05) {
        me.faceX = move.x;
        me.faceY = move.y;
      }
    } else {
      me.vx *= Math.pow(.985, dt / .02);
      me.vy *= Math.pow(.985, dt / .02);
    }

    me.x += me.vx * dt;
    me.y += me.vy * dt;

    me.x = Math.max(25, Math.min(1775, me.x));
    me.y = Math.max(25, Math.min(1175, me.y));

    // Мягкая коррекция предсказанной позиции
    const correction = Math.min(1, dt * 3);
    me.x += (me.tx - me.x) * correction;
    me.y += (me.ty - me.y) * correction;

    // Не перезаписываем скорость каждый пакет сервера:
    // это сохраняет плавное локальное управление.
    if (Math.hypot(me.vx, me.vy) > 65) {
      addDust(me.x, me.y, me.color);
    }
  }

  // Удалённые игроки плавно следуют за сервером
  for (const [id, p] of Object.entries(states)) {
    if (id === myId) continue;

    const blend = 1 - Math.exp(-dt * 13);
    p.x += (p.tx - p.x) * blend;
    p.y += (p.ty - p.y) * blend;
    p.vx = p.serverVX;
    p.vy = p.serverVY;

    if (Math.hypot(p.vx, p.vy) > 65) {
      addDust(p.x, p.y, p.color);
    }
  }

  // Частицы
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(.94, dt / .016);
    p.vy *= Math.pow(.94, dt / .016);
    p.life -= dt;

    if (p.life <= 0) particles.splice(i, 1);
  }

  effects = effects.filter(e => now - e.start < 400);
}

function drawBackground() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, width, height);

  const spacing = 80;
  const left = cameraX - width / 2;
  const top = cameraY - height / 2;

  ctx.fillStyle = "#f0f1f5";

  const startX = Math.floor(left / spacing) * spacing;
  const startY = Math.floor(top / spacing) * spacing;

  for (let x = startX; x < left + width + spacing; x += spacing) {
    for (let y = startY; y < top + height + spacing; y += spacing) {
      ctx.beginPath();
      ctx.arc(x - left, y - top, 1.25, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawStickman(p, time) {
  const speed = Math.hypot(p.vx || 0, p.vy || 0);
  const moving = speed > 18;
  const down = p.downUntil > Date.now();

  const walk = moving
    ? Math.sin(time * .014)
    : Math.sin(time * .002) * .06;

  const swing = moving ? walk * .7 : 0;
  const bob = moving ? Math.abs(Math.sin(time * .014)) * 2.7 : 0;

  const punchAge = time - (p.punchAt || 0);
  const punchPower = punchAge >= 0 && punchAge < 300
    ? Math.sin(punchAge / 300 * Math.PI)
    : 0;

  // Плавное падение и вставание
  let fall = 0;

  if (down) {
    const elapsed = time - (p.fallStarted || time);
    fall = Math.min(1, elapsed / 220);
  } else if (p.fallStarted) {
    const elapsed = time - (p.downUntil - 1250);
    fall = Math.max(0, 1 - Math.max(0, elapsed - 1250) / 300);
  }

  const color = p.color || "#5267e8";

  ctx.save();
  ctx.translate(p.x, p.y + bob);

  // Тень
  ctx.fillStyle = "#00000010";
  ctx.beginPath();
  ctx.ellipse(0, 27, down ? 27 : 19 + speed * .012, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Падение — поворот вокруг нижней части тела
  if (down) {
    ctx.translate(0, 5);
    ctx.rotate(Math.min(1.48, fall * 1.48));
    ctx.translate(0, -5);
  } else if (fall > 0) {
    ctx.rotate(fall * 1.48);
  }

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = color;
  ctx.lineWidth = 5;

  // Ноги
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.lineTo(-8 + swing * 11, 18);
  ctx.lineTo(-11 + swing * 19, 28);

  ctx.moveTo(0, 8);
  ctx.lineTo(8 - swing * 11, 18);
  ctx.lineTo(11 - swing * 19, 28);
  ctx.stroke();

  // Левая рука
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(-10 - swing * 10, -3);
  ctx.lineTo(-13 - swing * 13, 5);
  ctx.stroke();

  // Правая рука с замахом
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(10 + swing * 10 + punchPower * 23, -3 - punchPower * 8);
  ctx.lineTo(13 + swing * 13 + punchPower * 31, 5 - punchPower * 10);
  ctx.stroke();

  // Тело
  ctx.lineWidth = 5.5;
  ctx.beginPath();
  ctx.moveTo(0, -15);
  ctx.lineTo(0, 9);
  ctx.stroke();

  // Голова
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, -25, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Глаза
  ctx.fillStyle = "#343946";
  ctx.beginPath();
  ctx.arc(-3.2, -26, 1.15, 0, Math.PI * 2);
  ctx.arc(3.2, -26, 1.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Ник над персонажем
  ctx.fillStyle = "#747987";
  ctx.font = "12px Arial";
  ctx.textAlign = "center";
  ctx.fillText(p.name || "Игрок", p.x, p.y - 51);
}

function drawEffects(now) {
  for (const e of effects) {
    const age = (now - e.start) / 400;
    const alpha = Math.max(0, 1 - age);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#f0b94e";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.arc(e.x, e.y, 9 + age * 32, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      p.size * Math.max(.15, p.life / p.maxLife),
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

function frame(now) {
  const dt = Math.min((now - lastFrame) / 1000, .04);
  lastFrame = now;

  update(dt, now);

  const me = states[myId];

  if (me) {
    const cameraBlend = 1 - Math.exp(-dt * 5);
    cameraX += (me.x - cameraX) * cameraBlend;
    cameraY += (me.y - cameraY) * cameraBlend;
  }

  drawBackground();

  ctx.save();
  ctx.translate(width / 2 - cameraX, height / 2 - cameraY);

  ctx.strokeStyle = "#f0f1f4";
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, 1800, 1200);

  drawEffects(now);

  const ordered = Object.values(states).sort((a, b) => a.y - b.y);

  for (const p of ordered) {
    drawStickman(p, now);
  }

  ctx.restore();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
