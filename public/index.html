
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Little Stickmen</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffffef;
}

.panel {
  width: min(340px, calc(100% - 36px));
  padding: 30px 24px;
  border: 1px solid #eee;
  border-radius: 25px;
  text-align: center;
  background: white;
  box-shadow: 0 15px 50px #0000000c;
}

h1 {
  margin: 0 0 8px;
  font-size: 29px;
  letter-spacing: -1px;
  color: #242936;
}

.subtitle {
  color: #969ba6;
  margin-bottom: 24px;
  font-size: 14px;
}

input, button {
  font-size: 16px;
  border-radius: 13px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #e5e7eb;
  outline: none;
  text-align: center;
  margin-bottom: 10px;
  background: #fafafa;
}

#joinButton {
  width: 100%;
  padding: 14px;
  border: 0;
  color: white;
  background: #5267e8;
  font-weight: bold;
}

#status {
  color: #e05252;
  font-size: 13px;
  min-height: 18px;
  margin: 12px 0 0;
}

#top {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  padding: 9px 16px;
  border: 1px solid #eee;
  border-radius: 30px;
  background: #ffffffdf;
  color: #656b76;
  font-size: 13px;
  pointer-events: none;
}

#joystick {
  display: none;
  position: fixed;
  left: 25px;
  bottom: 28px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: #eef0f5a8;
  border: 1px solid #e4e6ed;
  z-index: 3;
  touch-action: none;
}

#stick {
  position: absolute;
  width: 55px;
  height: 55px;
  left: 37px;
  top: 37px;
  border-radius: 50%;
  background: white;
  border: 1px solid #e1e3e9;
  box-shadow: 0 4px 14px #00000015;
  pointer-events: none;
}

#punchButton {
  position: fixed;
  right: 28px;
  bottom: 38px;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: #5267e8;
  color: white;
  font-size: 14px;
  font-weight: bold;
  border: 4px solid white;
  box-shadow: 0 5px 20px #5267e855;
  z-index: 4;
  touch-action: none;
  display: none;
}

@media (pointer: coarse) {
  #joystick, #punchButton { display: block; }
}

@media (pointer: fine) {
  #punchButton {
    display: block;
    width: 65px;
    height: 65px;
    right: 22px;
    bottom: 22px;
    opacity: .8;
  }
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="top">Ожидание игроков...</div>

<div id="menu">
  <div class="panel">
    <h1>Little Stickmen</h1>
    <div class="subtitle">Маленький мир для двоих</div>
    <input id="code" value="TEST123" maxlength="12" placeholder="Код комнаты">
    <button id="joinButton">Играть</button>
    <p id="status"></p>
  </div>
</div>

<div id="joystick"><div id="stick"></div></div>
<button id="punchButton">УДАР</button>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const statusText = document.getElementById("status");
const topText = document.getElementById("top");

let myId = null;
let joined = false;
let players = [];
let smoothPlayers = {};
let lastInput = 0;
let lastTime = performance.now();
let width = innerWidth;
let height = innerHeight;
let dpr = 1;

const keys = {};
const input = { x: 0, y: 0 };
const particles = [];
const punchTimes = {};

let cameraX = 900;
let cameraY = 600;
let punchCooldown = 0;

function resize() {
  width = innerWidth;
  height = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

addEventListener("resize", resize);
resize();

function join() {
  statusText.textContent = "Подключаемся...";
  socket.emit("join", document.getElementById("code").value);
}

document.getElementById("joinButton").addEventListener("click", join);
document.getElementById("code").addEventListener("keydown", e => {
  if (e.key === "Enter") join();
});

socket.on("connect", () => {
  statusText.textContent = "";
});

socket.on("joined", id => {
  myId = id;
  joined = true;
  menu.style.display = "none";
});

socket.on("errorMessage", msg => {
  statusText.textContent = msg;
});

socket.on("players", list => {
  players = list;
  const alive = new Set(list.map(p => p.id));

  for (const id of Object.keys(smoothPlayers)) {
    if (!alive.has(id)) delete smoothPlayers[id];
  }

  for (const p of list) {
    if (!smoothPlayers[p.id]) {
      smoothPlayers[p.id] = {
        x: p.x, y: p.y,
        vx: p.vx || 0, vy: p.vy || 0,
        tx: p.x, ty: p.y
      };
    }

    const s = smoothPlayers[p.id];
    s.tx = p.x;
    s.ty = p.y;
    s.svx = p.vx || 0;
    s.svy = p.vy || 0;
  }

  topText.textContent = list.length === 2
    ? "Вы и ваш друг"
    : "Ожидание второго игрока...";
});

socket.on("punchEffect", data => {
  punchTimes[data.id] = performance.now();
  const p = smoothPlayers[data.id];

  if (p) {
    for (let i = 0; i < 9; i++) {
      particles.push({
        x: p.x + (Math.random() - .5) * 25,
        y: p.y - 12 + (Math.random() - .5) * 20,
        vx: (Math.random() - .5) * 110,
        vy: (Math.random() - .5) * 110,
        life: .45,
        size: 2 + Math.random() * 3
      });
    }
  }
});

// Клавиатура
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();

  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) {
    e.preventDefault();
  }

  keys[k] = true;

  if (e.code === "Space" && !e.repeat) punch();
});

addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  input.x = input.y = 0;
});

// Джойстик
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
let joyPointer = null;

function moveJoystick(e) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const max = 38;
  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx = dx / length * max;
    dy = dy / length * max;
  }

  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  input.x = dx / max;
  input.y = dy / max;
}

joystick.addEventListener("pointerdown", e => {
  joyPointer = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  moveJoystick(e);
});

joystick.addEventListener("pointermove", e => {
  if (e.pointerId === joyPointer) moveJoystick(e);
});

function releaseJoystick(e) {
  if (e.pointerId !== joyPointer) return;
  joyPointer = null;
  input.x = 0;
  input.y = 0;
  stick.style.transform = "translate(0, 0)";
}

joystick.addEventListener("pointerup", releaseJoystick);
joystick.addEventListener("pointercancel", releaseJoystick);

// Удар
function punch() {
  if (!joined || punchCooldown > 0) return;

  punchCooldown = .65;
  punchTimes[myId] = performance.now();
  socket.emit("punch");
}

document.getElementById("punchButton").addEventListener("pointerdown", e => {
  e.preventDefault();
  punch();
});

// Частицы
function addDust(x, y) {
  if (Math.random() > .2) return;

  particles.push({
    x: x + (Math.random() - .5) * 15,
    y: y + 24,
    vx: (Math.random() - .5) * 25,
    vy: -Math.random() * 18,
    life: .65,
    size: 2 + Math.random() * 3
  });
}

function getMovement() {
  let x = input.x;
  let y = input.y;

  if (keys["w"] || keys["arrowup"]) y -= 1;
  if (keys["s"] || keys["arrowdown"]) y += 1;
  if (keys["a"] || keys["arrowleft"]) x -= 1;
  if (keys["d"] || keys["arrowright"]) x += 1;

  const len = Math.hypot(x, y);

  if (len > 1) {
    x /= len;
    y /= len;
  }

  return { x, y };
}

function update(dt, now) {
  punchCooldown = Math.max(0, punchCooldown - dt);

  if (!joined) return;

  const move = getMovement();

  // Отправляем управление серверу, но не ждём ответа,
  // чтобы локальный персонаж двигался сразу.
  if (now - lastInput > 33) {
    socket.emit("input", move);
    lastInput = now;
  }

  const me = smoothPlayers[myId];

  if (me) {
    me.vx += move.x * 260 * .16 * (dt / .033);
    me.vy += move.y * 260 * .16 * (dt / .033);

    const friction = Math.pow(.84, dt / .033);
    me.vx *= friction;
    me.vy *= friction;

    const speed = Math.hypot(me.vx, me.vy);

    if (speed > 260) {
      me.vx = me.vx / speed * 260;
      me.vy = me.vy / speed * 260;
    }

    me.x += me.vx * dt;
    me.y += me.vy * dt;

    me.x = Math.max(25, Math.min(1775, me.x));
    me.y = Math.max(25, Math.min(1175, me.y));

    // Мягко исправляем расхождение с сервером.
    const errorX = me.tx - me.x;
    const errorY = me.ty - me.y;

    me.x += errorX * Math.min(1, dt * 2.5);
    me.y += errorY * Math.min(1, dt * 2.5);

    me.vx += (me.svx - me.vx) * Math.min(1, dt * 1.8);
    me.vy += (me.svy - me.vy) * Math.min(1, dt * 1.8);

    if (Math.hypot(me.vx, me.vy) > 80) addDust(me.x, me.y);
  }

  // Другие игроки плавно следуют за серверными координатами.
  for (const [id, p] of Object.entries(smoothPlayers)) {
    if (id === myId) continue;

    const blend = Math.min(1, dt * 12);
    p.x += (p.tx - p.x) * blend;
    p.y += (p.ty - p.y) * blend;
    p.vx = p.svx;
    p.vy = p.svy;

    if (Math.hypot(p.vx, p.vy) > 80) addDust(p.x, p.y);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 1.7;

    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawBackground() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, width, height);

  const spacing = 80;
  const left = cameraX - width / 2;
  const top = cameraY - height / 2;

  ctx.fillStyle = "#f1f2f5";

  const startX = Math.floor(left / spacing) * spacing;
  const startY = Math.floor(top / spacing) * spacing;

  for (let x = startX; x < left + width + spacing; x += spacing) {
    for (let y = startY; y < top + height + spacing; y += spacing) {
      ctx.beginPath();
      ctx.arc(x - left, y - top, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawStickman(p, time) {
  const speed = Math.hypot(p.vx, p.vy);
  const moving = speed > 15;
  const walk = moving ? Math.sin(time * .014) : Math.sin(time * .002) * .06;
  const swing = moving ? walk * .65 : 0;
  const bob = moving ? Math.abs(Math.sin(time * .014)) * 2.5 : Math.sin(time * .002) * 1.2;

  const isMe = p.id === myId;
  const color = isMe ? "#5267e8" : "#ef795f";
  const x = p.x;
  const y = p.y + bob;

  const punchAge = time - (punchTimes[p.id] || 0);
  const punching = punchAge >= 0 && punchAge < 250;
  const punchSwing = punching ? Math.sin(punchAge / 250 * Math.PI) : 0;

  ctx.save();
  ctx.translate(x, y);

  // Тень
  ctx.fillStyle = "#0000000d";
  ctx.beginPath();
  ctx.ellipse(0, 27, 19 + speed * .012, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = color;
  ctx.lineWidth = 5;

  // Ноги
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.lineTo(-8 + swing * 11, 18);
  ctx.lineTo(-11 + swing * 19, 28);

  ctx.moveTo(0, 8);
  ctx.lineTo(8 - swing * 11, 18);
  ctx.lineTo(11 - swing * 19, 28);
  ctx.stroke();

  // Руки
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(-10 - swing * 10, -3);
  ctx.lineTo(-13 - swing * 13, 5);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(10 + swing * 10 + punchSwing * 22, -3 - punchSwing * 7);
  ctx.lineTo(13 + swing * 13 + punchSwing * 30, 5 - punchSwing * 9);
  ctx.stroke();

  // Тело
  ctx.lineWidth = 5.5;
  ctx.beginPath();
  ctx.moveTo(0, -15);
  ctx.lineTo(0, 9);
  ctx.stroke();

  // Голова
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, -25, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Глаза
  ctx.fillStyle = "#343946";
  ctx.beginPath();
  ctx.arc(-3.2, -26, 1.15, 0, Math.PI * 2);
  ctx.arc(3.2, -26, 1.15, 0, Math.PI * 2);
  ctx.fill();

  // Подпись
  ctx.fillStyle = "#747987";
  ctx.font = "12px Arial";
  ctx.textAlign = "center";
  ctx.fillText(isMe ? "Ты" : "Друг", 0, -44);

  ctx.restore();
}

function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, .05);
  lastTime = now;

  update(dt, now);

  const me = smoothPlayers[myId];

  if (me) {
    cameraX += (me.x - cameraX) * Math.min(1, dt * 5);
    cameraY += (me.y - cameraY) * Math.min(1, dt * 5);
  }

  drawBackground();

  ctx.save();
  ctx.translate(width / 2 - cameraX, height / 2 - cameraY);

  ctx.strokeStyle = "#f0f1f4";
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, 1800, 1200);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life) * .4;
    ctx.fillStyle = "#aeb4c2";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;

  const ordered = Object.values(smoothPlayers)
    .sort((a, b) => a.y - b.y);

  for (const p of ordered) {
    drawStickman(p, now);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
